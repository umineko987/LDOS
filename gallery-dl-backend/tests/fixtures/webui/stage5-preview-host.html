<!doctype html>
<html lang="zh-CN" data-motion="on" data-theme-tone="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>ImageWeave Stage 5 tests-only preview host</title>
  <link rel="stylesheet" href="/__webui__/styles/tokens.css">
  <link rel="stylesheet" href="/__webui__/styles/base.css">
  <link rel="stylesheet" href="/__webui__/styles/controls.css">
  <link rel="stylesheet" href="/__webui__/styles/status.css">
  <link rel="stylesheet" href="/__webui__/styles/apps/gallery.css">
  <link rel="stylesheet" href="/__webui__/styles/apps/schedule.css">
  <link rel="stylesheet" href="/__webui__/styles/apps/export.css">
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { color: var(--imageweave-text-primary); background: #26323d; }
    .stage5-fixture-shell { display: grid; grid-template-rows: 34px minmax(0, 1fr); width: 100%; height: 100%; padding: 0; }
    .stage5-fixture-banner { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 14px; border-bottom: 1px solid var(--imageweave-separator); color: var(--imageweave-text-primary); background: var(--imageweave-surface-navigation-solid); font: 700 12px/1 system-ui, sans-serif; }
    .stage5-fixture-window { position: relative; min-width: 0; min-height: 0; overflow: hidden; background: var(--imageweave-surface-content-solid); }
    .stage5-fixture-window > .app-view { position: relative; }
  </style>
</head>
<body>
  <main class="stage5-fixture-shell" data-stage5-tests-only="true">
    <header class="stage5-fixture-banner">
      <strong>Stage 5 tests-only fixture host</strong>
      <span data-stage5-fixture-label>正在准备显式注入…</span>
    </header>
    <section class="stage5-fixture-window" data-stage5-host></section>
  </main>
  <script type="module" src="./stage5-preview-host.js"></script>
</body>
</html>
