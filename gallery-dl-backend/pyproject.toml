[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gallery-dl-proxy-backend"
version = "0.5.2"
description = "FastAPI job backend for gallery-dl with a native subscription proxy pool"
readme = { text = "ImageWeave gallery-dl 后端组件；项目介绍与使用说明见仓库根 README。", content-type = "text/markdown" }
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "httpx2>=2.0",
  "uvicorn>=0.30",
  "pydantic>=2.8",
  "requests>=2.31",
  "curl-cffi>=0.13",
  "PySocks>=1.7.1",
  "PyYAML>=6.0",
  "filelock>=3.13",
  "websocket-client>=1.8",
  "Pillow==12.1.1",
]

# 后端、去重与测试工具的直接依赖只在本文件维护；
# requirements*.txt 均由 scripts/lock-dependencies.sh 生成，禁止手工改锁文件。
[dependency-groups]
test = [
  "coverage[toml]>=7.13,<8",
]
dedup-common = [
  "numpy==2.4.2",
  "opencv-python-headless==4.13.0.92",
  "Pillow==12.1.1",
  "tqdm==4.67.3",
]
dedup-cpu = [
  { include-group = "dedup-common" },
  "torch==2.11.0",
  "torchvision==0.26.0",
]
dedup-cuda = [
  { include-group = "dedup-common" },
  "torch==2.11.0 ; sys_platform == 'linux' or sys_platform == 'win32'",
  "torchvision==0.26.0 ; sys_platform == 'linux' or sys_platform == 'win32'",
]

[project.scripts]
gdl-backend = "gdl_backend.__main__:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["gdl_backend*"]

[tool.setuptools.package-data]
gdl_backend = [
  "webui_dist/*.html",
  "webui_dist/*.json",
  "webui_dist/assets/*",
]

# scripts/run-python-coverage.py supplies the narrow source boundary for each
# component.  Branch mode is shared and no production package is globally
# omitted here.
[tool.coverage.run]
branch = true
relative_files = true

[tool.coverage.report]
precision = 6
show_missing = true
skip_empty = false

[tool.coverage.json]
pretty_print = true
