name: Windows CPU 快速门槛

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-cpu:
    name: Windows CPU 安装、测试与服务 smoke
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            gallery-dl-backend/requirements.txt
            requirements-dedup-cpu.txt
      - uses: actions/setup-node@v6
        with:
          node-version: "24.13.0"
      - name: PowerShell 语法检查
        run: |
          $failed = $false
          foreach ($path in (git ls-files "*.ps1")) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $path),
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            foreach ($parseError in $parseErrors) {
              Write-Error "$path：$($parseError.Message)" -ErrorAction Continue
              $failed = $true
            }
          }
          if ($failed) {
            throw "PowerShell 语法检查失败。"
          }
      - name: 安装 Windows 后端锁定依赖
        run: |
          python -m venv .\gallery-dl-backend\.venv
          if ($LASTEXITCODE -ne 0) { throw "创建后端虚拟环境失败。" }
          & .\gallery-dl-backend\.venv\Scripts\python.exe -m pip install `
            --disable-pip-version-check --no-input --require-hashes --only-binary=:all: `
            -r .\gallery-dl-backend\requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "安装后端锁定依赖失败。" }
      - name: 干净 Windows CPU 锁定安装（不下载模型）
        run: .\setup-dedup.ps1 -Device cpu -SkipModels
      - name: CPU 纯净性与根测试
        run: |
          & .\.venv\Scripts\python.exe .\scripts\check-cpu-environment.py
          if ($LASTEXITCODE -ne 0) { throw "Windows CPU 纯净性检查失败。" }
          & .\.venv\Scripts\python.exe -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw "Windows 根测试失败。" }
      - name: 后端完整测试
        working-directory: gallery-dl-backend
        run: |
          & .\.venv\Scripts\python.exe -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw "Windows 后端测试失败。" }
      - name: healthz / readyz 与 PowerShell 启动语义
        run: .\scripts\smoke-windows-service.ps1
      - name: 工作区与差异格式
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw "git diff --check 失败。" }
          $status = git status --short --untracked-files=no
          if ($LASTEXITCODE -ne 0) { throw "git status 失败。" }
          if ($status) {
            $status | Write-Host
            throw "测试修改了已跟踪文件。"
          }
