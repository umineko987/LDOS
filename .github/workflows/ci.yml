name: LDOS CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ldos-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  FORCE_COLOR: "1"

jobs:
  go-backend:
    name: Go business backend / Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: backend/go.sum
      - name: Run native backend race tests
        working-directory: backend
        run: go test -race ./...
      - name: Vet native backend
        working-directory: backend
        run: go vet ./...
      - name: Build native backend
        working-directory: backend
        run: go build ./cmd/ldos-backend

  linux-cpu:
    name: Linux CPU / managed Python
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Go for the native service
        uses: actions/setup-go@v6
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: backend/go.sum

      - name: Deploy clean locked CPU environments
        run: ./scripts/setup-linux.sh --device cpu --skip-mihomo

      - name: Verify locked interpreter and real CPU inference
        run: |
          .venv/bin/python -c 'import json, platform; assert platform.python_version() == json.load(open("desktop/release/runtime-lock.json"))["distribution"]["python_version"]'
          .venv/bin/python dedup/dedup_core.py --prepare-models --model-dir "$PWD/.models" --device cpu
          .venv/bin/python scripts/run-real-model-smoke.py --base-images 2 --workers 1 --torch-threads 2 --torch-interop-threads 1

      - name: Install locked test tools in both environments
        shell: bash
        run: |
          for python_bin in ./.venv/bin/python ./gallery-dl-backend/.venv/bin/python; do
            "$python_bin" -m pip install \
              --disable-pip-version-check --no-input \
              --require-hashes --only-binary=:all: \
              -r gallery-dl-backend/requirements-test.txt
          done

      - name: Test native search with the real gallery executor
        run: |
          ./gallery-dl-backend/.venv/bin/python -c "import requests; import pathlib; assert pathlib.Path('gallery-dl-codeberg/gallery_dl/__init__.py').is_file()"
          cd backend
          go test -race -timeout 5m -count=1 ./internal/gallery ./internal/discovery

      - name: Run repository tests
        run: ./.venv/bin/python -m unittest discover -s tests -v

      - name: Run standalone gallery executor tests
        run: PYTHONPATH=backend/executors ./gallery-dl-backend/.venv/bin/python -m unittest discover -s backend/executors/tests -v

      - name: Run Linux service smoke test
        run: ./scripts/smoke-linux-service.sh


  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Go for mygo and the native backend
        uses: actions/setup-go@v6
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: |
            desktop/go.sum
            backend/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: desktop/.node-version
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install locked frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Generate native bindings and check the API snapshot
        working-directory: desktop
        run: |
          npm run generate
          python3 ../scripts/export_openapi.py --check

      - name: Test the native desktop lifecycle
        working-directory: desktop
        run: go test -race ./src-mygo

      - name: Check Svelte and TypeScript
        working-directory: desktop
        run: npm run check

      - name: Run frontend unit tests
        working-directory: desktop
        run: npm test

      - name: Build native desktop and backend artifacts
        working-directory: desktop
        run: npm run build
