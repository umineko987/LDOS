name: Windows CPU 真实模型闭环

on:
  schedule:
    - cron: "47 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-model-worker:
    name: SSCD + DINOv2 Windows CPU worker
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dedup-cpu.txt
      - name: 缓存公开模型（不缓存 embedding 数据库）
        uses: actions/cache@v6
        with:
          path: |
            .models/sscd_disc_mixup.torchscript.pt
            .models/torch/hub/checkpoints/dinov2_vits14_pretrain.pth
            .models/torch/hub/facebookresearch_dinov2_7764ea0f912e53c92e82eb78a2a1631e92725fc8
          key: imageweave-windows-public-models-sscd-9f26bd4c-dino-b938bf1b-r7764ea0f
      - name: Windows CPU 锁定安装与模型固定校验
        run: .\setup-dedup.ps1 -Device cpu
      - name: CPU 纯净性
        run: |
          & .\.venv\Scripts\python.exe .\scripts\check-cpu-environment.py
          if ($LASTEXITCODE -ne 0) { throw "Windows CPU 纯净性检查失败。" }
      - name: 可重复变体夹具固定模型分类（禁止 skip）
        env:
          IMAGEWEAVE_REAL_MODELS: "1"
        run: |
          & .\.venv\Scripts\python.exe -m unittest tests.test_real_variant_pairs -v
          if ($LASTEXITCODE -ne 0) { throw "Windows 真实变体分类失败。" }
          & .\.venv\Scripts\python.exe tests\fixtures\real_variant_pairs\refresh_embeddings.py `
            --model-dir .models --check
          if ($LASTEXITCODE -ne 0) { throw "Windows 真实变体夹具校验失败。" }
      - name: 程序生成样本真实 worker 闭环
        run: |
          & .\.venv\Scripts\python.exe .\scripts\run-real-model-smoke.py --base-images 4
          if ($LASTEXITCODE -ne 0) { throw "Windows 真实模型 worker 闭环失败。" }
      - name: 工作区与差异格式
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw "git diff --check 失败。" }
          $status = git status --short --untracked-files=no
          if ($LASTEXITCODE -ne 0) { throw "git status 失败。" }
          if ($status) {
            $status | Write-Host
            throw "测试修改了已跟踪文件。"
          }
