name: Desktop release bundles

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "gallery-dl-backend/**"
      - "gallery-dl-codeberg"
      - "scripts/desktop_release.py"
      - "scripts/third_party_notices.py"
      - "tests/test_desktop_release.py"
      - "tests/test_third_party_notices.py"
      - "rust-toolchain.toml"
      - "dedup_core.py"
      - "dedup_review_worker.py"
      - "requirements-dedup-cpu.txt"
      - ".github/workflows/desktop-release.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "gallery-dl-backend/**"
      - "gallery-dl-codeberg"
      - "scripts/desktop_release.py"
      - "scripts/third_party_notices.py"
      - "tests/test_desktop_release.py"
      - "tests/test_third_party_notices.py"
      - "rust-toolchain.toml"
      - "dedup_core.py"
      - "dedup_review_worker.py"
      - "requirements-dedup-cpu.txt"
      - ".github/workflows/desktop-release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    name: ${{ matrix.name }} unsigned bundle
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-24.04
            artifact: imageweave-linux-x86_64-unsigned
            paths: |
              desktop/src-tauri/target/release/bundle/deb/*.deb
              desktop/src-tauri/target/release/bundle/appimage/*.AppImage
              desktop/src-tauri/release/backend/release-manifest.json
              desktop/src-tauri/release/backend/release-files.sha256
          - name: Windows x86_64
            os: windows-2025
            artifact: imageweave-windows-x86_64-unsigned
            paths: |
              desktop/src-tauri/target/release/bundle/nsis/*.exe
              desktop/src-tauri/release/backend/release-manifest.json
              desktop/src-tauri/release/backend/release-files.sha256
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v6
        with:
          node-version: "24.13.0"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Verify release notice contracts
        run: |
          python -m compileall -q scripts/desktop_release.py scripts/third_party_notices.py
          python -m unittest tests.test_third_party_notices
      - uses: actions/cache@v5
        with:
          path: .release-cache
          key: desktop-runtime-${{ runner.os }}-${{ hashFiles('desktop/release/runtime-lock.json') }}
      - name: Install Linux Tauri bundle prerequisites
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          libssl-dev libgtk-3-dev libfuse2 zstd
      - name: Select locked Rust 1.98.0
        shell: bash
        run: |
          rustup set profile minimal
          rustup toolchain install 1.98.0 --component rustfmt
          rustup default 1.98.0
          rustc -Vv
      - name: Build and statically verify canonical bundle
        run: python scripts/desktop_release.py build --cache-dir .release-cache
      - name: Verify tracked checkout stayed clean
        shell: bash
        run: |
          git diff --check
          test -z "$(git status --short --untracked-files=no)"
      - name: Upload unsigned verified bundle
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
          retention-days: 14
