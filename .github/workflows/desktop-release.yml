name: LDOS desktop deployment

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "desktop/**"
      - "gallery-dl-backend/**"
      - "gallery-dl-codeberg"
      - "scripts/desktop_release.py"
      - "scripts/third_party_notices.py"
      - "tests/test_desktop_release.py"
      - "tests/test_third_party_notices.py"
      - "rust-toolchain.toml"
      - "dedup/**"
      - "requirements-dedup-cpu.txt"
      - ".gitattributes"
      - ".github/workflows/desktop-release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ldos-desktop-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  FORCE_COLOR: "1"

jobs:
  frontend:
    name: Canonical frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python for artifact tooling
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.13.0"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Build canonical frontend
        working-directory: desktop
        run: |
          npm ci
          npm run build

      - name: Verify generated projection is committed and byte-stable
        shell: bash
        run: |
          git diff --check
          test -z "$(git status --short --untracked-files=no)"
          test -f desktop/dist/index.html

      - name: Upload canonical frontend dist
        uses: actions/upload-artifact@v7
        with:
          name: canonical-frontend
          path: desktop/dist
          if-no-files-found: error
          retention-days: 3

  bundle:
    name: ${{ matrix.name }} desktop bundle
    needs: frontend
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-24.04
            platform: linux
            artifact: ldos-linux-x86_64
          - name: Windows x86_64
            os: windows-2025
            platform: windows
            artifact: ldos-windows-x86_64
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.13.0"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Linux bundle prerequisites
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          if apt-cache show libfuse2t64 >/dev/null 2>&1; then
            fuse_package=libfuse2t64
          else
            fuse_package=libfuse2
          fi
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libgtk-3-dev \
            patchelf \
            zstd \
            "$fuse_package"

      - name: Install Windows bundle inspection tools
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          if (-not (Get-Command 7z.exe -ErrorAction SilentlyContinue)) {
            choco install 7zip --yes --no-progress
          }
          $sevenZipDir = 'C:\Program Files\7-Zip'
          if (Test-Path -LiteralPath $sevenZipDir) {
            $sevenZipDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            $env:Path = "$sevenZipDir;$env:Path"
          }
          if (-not (Get-Command 7z.exe -ErrorAction SilentlyContinue)) {
            throw '7z.exe is required to verify the NSIS bundle.'
          }
          & 7z.exe -h | Select-Object -First 1

      - name: Select locked Rust toolchain
        shell: bash
        env:
          RUSTUP_TOOLCHAIN: "1.98.0"
        run: |
          rustup set profile minimal
          rustup toolchain install 1.98.0 --component rustfmt
          rustup default 1.98.0
          rustc -Vv

      - name: Verify release notice contracts
        run: |
          python -m compileall -q scripts/desktop_release.py scripts/third_party_notices.py
          python -m unittest tests.test_third_party_notices

      - name: Restore desktop runtime cache
        uses: actions/cache@v6
        with:
          path: .release-cache
          key: desktop-runtime-${{ runner.os }}-${{ hashFiles('desktop/release/runtime-lock.json') }}
          restore-keys: |
            desktop-runtime-${{ runner.os }}-

      - name: Restore canonical frontend dist
        uses: actions/download-artifact@v8
        with:
          name: canonical-frontend
          path: desktop/dist

      - name: Check restored frontend before packaging
        shell: bash
        run: test -f desktop/dist/index.html

      - name: Build, run, and statically verify the bundle
        env:
          LDOS_PREBUILT_FRONTEND: "1"
        run: python scripts/desktop_release.py build --cache-dir .release-cache

      - name: Verify tracked checkout stayed clean
        shell: bash
        run: |
          git diff --check
          test -z "$(git status --short --untracked-files=no)"

      - name: Upload verified Linux bundle
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/release/backend/release-manifest.json
            desktop/src-tauri/release/backend/release-files.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload verified Windows bundle
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/release/backend/release-manifest.json
            desktop/src-tauri/release/backend/release-files.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out release metadata
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Verify tag matches the desktop version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - "$RELEASE_TAG" <<'PY'
          import json
          import sys
          import tomllib
          from pathlib import Path

          root = Path.cwd()
          versions = {
              "Cargo.toml": tomllib.loads(
                  (root / "desktop/src-tauri/Cargo.toml").read_text(encoding="utf-8")
              )["package"]["version"],
              "package.json": json.loads(
                  (root / "desktop/package.json").read_text(encoding="utf-8")
              )["version"],
              "tauri.conf.json": json.loads(
                  (root / "desktop/src-tauri/tauri.conf.json").read_text(encoding="utf-8")
              )["version"],
          }
          if len(set(versions.values())) != 1:
              raise SystemExit(f"desktop versions do not match: {versions}")
          version = next(iter(versions.values()))
          expected_tag = f"v{version}"
          if sys.argv[1] != expected_tag:
              raise SystemExit(
                  f"release tag {sys.argv[1]!r} does not match {expected_tag!r}"
              )
          PY

      - name: Download verified Linux bundle
        uses: actions/download-artifact@v8
        with:
          name: ldos-linux-x86_64
          path: release-assets/linux

      - name: Download verified Windows bundle
        uses: actions/download-artifact@v8
        with:
          name: ldos-windows-x86_64
          path: release-assets/windows

      - name: Collect installers and checksums
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path

          root = Path("release-assets")
          upload = root / "upload"
          upload.mkdir()
          patterns = {
              "Linux DEB": "linux/**/bundle/deb/*.deb",
              "Linux AppImage": "linux/**/bundle/appimage/*.AppImage",
              "Windows NSIS": "windows/**/bundle/nsis/*.exe",
          }
          installers = []
          for label, pattern in patterns.items():
              matches = list(root.glob(pattern))
              if len(matches) != 1:
                  raise SystemExit(
                      f"expected one {label} installer, found {len(matches)}"
                  )
              destination = upload / matches[0].name
              matches[0].replace(destination)
              installers.append(destination)

          lines = []
          for installer in sorted(installers):
              digest = hashlib.sha256()
              with installer.open("rb") as stream:
                  for block in iter(lambda: stream.read(1024 * 1024), b""):
                      digest.update(block)
              lines.append(f"{digest.hexdigest()}  {installer.name}\n")
          (upload / "SHA256SUMS.txt").write_text("".join(lines), encoding="utf-8")
          PY

      - name: Create or repair the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/upload/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/upload/* \
              --verify-tag \
              --title "LDOS $GITHUB_REF_NAME" \
              --generate-notes \
              --latest
          fi
