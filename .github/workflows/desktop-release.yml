name: Linux mygo build validation (no release)

# Public desktop publishing is paused during the host migration. Tags must not
# publish the old Tauri installers. This manual job only validates a Linux build.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ldos-mygo-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-build:
    name: Linux x86_64 source-runtime build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: desktop/.node-version
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Linux WebView libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install locked frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Run Linux host tests
        working-directory: desktop
        run: go test ./src-mygo/...

      - name: Build Linux host with embedded frontend
        working-directory: desktop
        run: npm run build

      - name: Verify build and checkout
        run: |
          test -x desktop/build/linux-amd64/ldos
          test -x backend/build/ldos-backend
          git diff --check
          test -z "$(git status --short --untracked-files=no)"

      # No upload-artifact, write token, GitHub Release or native runtime claim.
      # Native GUI/Go-backend acceptance uses scripts/smoke-mygo-linux.py locally.
