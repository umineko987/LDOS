name: Linux CPU 快速门槛

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: 后端完整测试 / Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            gallery-dl-backend/requirements.txt
            gallery-dl-backend/requirements-test.txt
      - name: 安装后端锁定依赖
        run: >-
          ./scripts/setup-linux.sh --device cpu
          --skip-dedup-deps --skip-models --skip-mihomo
      - name: 安装锁定测试工具
        run: >-
          ./gallery-dl-backend/.venv/bin/python -m pip install
          --disable-pip-version-check --no-input --require-hashes --only-binary=:all:
          -r gallery-dl-backend/requirements-test.txt
      - name: 后端完整测试
        if: matrix.python == '3.11'
        working-directory: gallery-dl-backend
        run: ./.venv/bin/python -m unittest discover -s tests -v
      - name: 后端 branch coverage 门槛
        if: matrix.python == '3.14'
        run: >-
          ./gallery-dl-backend/.venv/bin/python scripts/run-python-coverage.py
          backend --output artifacts/coverage/backend
      - name: 保存后端 coverage 报告
        if: always() && matrix.python == '3.14'
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage-linux-py314
          path: artifacts/coverage/backend
          include-hidden-files: true
          if-no-files-found: error

  linux-cpu:
    name: Linux CPU 安装、根测试与服务 smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            gallery-dl-backend/requirements.txt
            gallery-dl-backend/requirements-test.txt
            requirements-dedup-cpu.txt
      - name: Shell 语法与依赖漂移
        run: |
          git ls-files '*.sh' | xargs -r -n1 bash -n
          ./scripts/lock-dependencies.sh --check
      - name: 干净 CPU 锁定安装（不下载模型）
        run: ./scripts/setup-linux.sh --device cpu --skip-models --skip-mihomo
      - name: 安装锁定测试工具
        run: >-
          ./.venv/bin/python -m pip install
          --disable-pip-version-check --no-input --require-hashes --only-binary=:all:
          -r gallery-dl-backend/requirements-test.txt
      - name: CPU 纯净性与根 dedup branch coverage 门槛
        run: |
          ./.venv/bin/python ./scripts/check-cpu-environment.py
          ./.venv/bin/python scripts/run-python-coverage.py dedup --output artifacts/coverage/dedup
      - name: 保存根 dedup coverage 报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dedup-coverage-linux-py314
          path: artifacts/coverage/dedup
          include-hidden-files: true
          if-no-files-found: error
      - name: healthz / readyz 语义
        run: ./scripts/smoke-linux-service.sh
      - name: 工作区与差异格式
        run: |
          git diff --check
          test -z "$(git status --short --untracked-files=no)"

  frontend:
    name: Desktop Svelte/Vite 单一前端门槛
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v6
        with:
          node-version: "24.13.0"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: 安装唯一锁定前端依赖
        working-directory: desktop
        run: npm ci
      - name: Svelte 与 TypeScript 静态检查
        working-directory: desktop
        run: npm run check
      - name: Desktop 单元与静态合同
        working-directory: desktop
        run: npm test
      - name: Desktop core coverage 门槛
        working-directory: desktop
        run: npm run test:coverage
      - name: 安装 Chromium GUI 测试运行时与 CJK 字体
        working-directory: desktop
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Chromium 全应用 GUI、键盘、无障碍与视觉回归
        working-directory: desktop
        run: npm run test:e2e
      - name: 保存 GUI 测试诊断
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-gui-playwright-linux
          path: |
            desktop/playwright-report
            desktop/test-results
          if-no-files-found: ignore
          retention-days: 14
      - name: 生成并同步 canonical 前端
        working-directory: desktop
        run: npm run build
      - name: Tauri 与后端前端字节一致性
        working-directory: desktop
        run: npm run verify:artifacts
      - name: 构建后端 wheel
        run: >-
          python -m pip wheel --disable-pip-version-check --no-deps
          --wheel-dir artifacts/wheel ./gallery-dl-backend
      - name: wheel 前端字节与 RECORD 一致性
        run: |
          wheel="$(find artifacts/wheel -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$wheel"
          python scripts/frontend_artifacts.py verify --wheel "$wheel"
      - name: 保存 Desktop coverage 报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-core-coverage-node-24.13.0
          path: desktop/coverage
          if-no-files-found: error
      - name: Legacy 闭包、工作区与差异格式
        run: |
          test -z "$(git ls-files 'gallery-dl-backend/gdl_backend/webui/**')"
          test -z "$(git ls-files 'gallery-dl-backend/tests/*.mjs' 'scripts/run-webui-coverage.py' 'scripts/summarize-node-coverage.cjs')"
          git diff --check
          test -z "$(git status --short --untracked-files=no)"
