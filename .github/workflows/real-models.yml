name: ImageWeave real-model CPU smoke

on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: imageweave-real-models-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"

jobs:
  linux:
    name: Linux SSCD + DINOv2 CPU worker
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            gallery-dl-backend/requirements.txt
            requirements-dedup-cpu.txt

      - name: Restore verified public model cache
        uses: actions/cache@v6
        with:
          path: |
            .models/sscd_disc_mixup.torchscript.pt
            .models/torch/hub/checkpoints/dinov2_vits14_pretrain.pth
            .models/torch/hub/facebookresearch_dinov2_7764ea0f912e53c92e82eb78a2a1631e92725fc8
          key: imageweave-linux-public-models-sscd-9f26bd4c-dino-b938bf1b-r7764ea0f

      - name: Install locked CPU environment and verify models
        run: ./scripts/setup-linux.sh --python python --device cpu --skip-mihomo

      - name: Verify CPU package purity
        run: ./.venv/bin/python scripts/check-cpu-environment.py

      - name: Verify pinned real-model fixture embeddings
        env:
          IMAGEWEAVE_REAL_MODELS: "1"
        run: |
          ./.venv/bin/python -m unittest tests.test_real_variant_pairs -v
          ./.venv/bin/python tests/fixtures/real_variant_pairs/refresh_embeddings.py \
            --model-dir .models --check

      - name: Run generated-image real-model worker smoke
        run: |
          mkdir -p artifacts/real-models
          ./.venv/bin/python scripts/run-real-model-smoke.py \
            --base-images 4 \
            --report artifacts/real-models/linux-report.json

      - name: Upload real-model report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: real-model-linux-report
          path: artifacts/real-models
          if-no-files-found: ignore
          retention-days: 14

      - name: Verify tracked checkout is clean
        shell: bash
        run: |
          git diff --check
          test -z "$(git status --short --untracked-files=no)"

  windows:
    name: Windows SSCD + DINOv2 CPU worker
    runs-on: windows-2025
    timeout-minutes: 105
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements-dedup-cpu.txt
            gallery-dl-backend/requirements.txt

      - name: Restore verified public model cache
        uses: actions/cache@v6
        with:
          path: |
            .models/sscd_disc_mixup.torchscript.pt
            .models/torch/hub/checkpoints/dinov2_vits14_pretrain.pth
            .models/torch/hub/facebookresearch_dinov2_7764ea0f912e53c92e82eb78a2a1631e92725fc8
          key: imageweave-windows-public-models-sscd-9f26bd4c-dino-b938bf1b-r7764ea0f

      - name: Install locked CPU environment and verify models
        run: .\setup-dedup.ps1 -Device cpu

      - name: Verify CPU package purity
        run: |
          & .\.venv\Scripts\python.exe .\scripts\check-cpu-environment.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows CPU purity check failed.' }

      - name: Verify pinned real-model fixture embeddings
        env:
          IMAGEWEAVE_REAL_MODELS: "1"
        run: |
          & .\.venv\Scripts\python.exe -m unittest tests.test_real_variant_pairs -v
          if ($LASTEXITCODE -ne 0) { throw 'Windows real-model fixture check failed.' }
          & .\.venv\Scripts\python.exe tests\fixtures\real_variant_pairs\refresh_embeddings.py `
            --model-dir .models --check
          if ($LASTEXITCODE -ne 0) { throw 'Windows pinned embedding check failed.' }

      - name: Run generated-image real-model worker smoke
        run: |
          New-Item -ItemType Directory -Force -Path artifacts\real-models | Out-Null
          & .\.venv\Scripts\python.exe .\scripts\run-real-model-smoke.py `
            --base-images 4 `
            --report artifacts\real-models\windows-report.json
          if ($LASTEXITCODE -ne 0) { throw 'Windows real-model worker smoke failed.' }

      - name: Upload real-model report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: real-model-windows-report
          path: artifacts/real-models
          if-no-files-found: ignore
          retention-days: 14

      - name: Verify tracked checkout is clean
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed.' }
          $status = git status --short --untracked-files=no
          if ($LASTEXITCODE -ne 0) { throw 'git status failed.' }
          if ($status) {
            $status | Write-Host
            throw 'Real-model checks modified tracked files.'
          }
